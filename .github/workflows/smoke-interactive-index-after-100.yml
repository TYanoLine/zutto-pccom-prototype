name: smoke-interactive-index-after-100

on:
  push:
    branches:
      - ops/smoke-interactive-index-after-100-20260911
    paths:
      - .github/workflows/smoke-interactive-index-after-100.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/smoke-interactive-index-after-100-20260911
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Run live ATDT smoke
        run: |
          cd apps/server
          ZUTTO_LIVE_SMOKE=1 go test ./internal/ws -run TestLiveInteractiveArticleIndexSmoke -v -count=1
