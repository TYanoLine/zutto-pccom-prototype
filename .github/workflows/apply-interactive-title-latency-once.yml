name: apply-interactive-title-latency-once

on:
  push:
    branches:
      - fix/interactive-title-index-latency
    paths:
      - .github/workflows/apply-interactive-title-latency-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/interactive-title-index-latency
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: python3 scripts/apply_interactive_title_latency_patch.py
      - name: Format
        run: |
          cd apps/server
          gofmt -w \
            internal/worldrepo/materialization_demo_persona.go \
            internal/worldrepo/materialization_title_era.go \
            internal/worldrepo/materialization_title_first.go \
            internal/worldrepo/materialization_article_debug.go \
            internal/worldrepo/materialization_interactive_title_first.go \
            internal/worldrepo/materialization_interactive_board.go \
            internal/worldrepo/materialization_interactive_detail.go \
            internal/worldrepo/materialization_interactive_latency_test.go \
            internal/hostprogram/materializationdemo/runtime.go \
            internal/hostprogram/materializationdemo/runtime_index_async_test.go
      - name: Test
        run: |
          cd apps/server
          go test ./...
      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/internal/worldrepo apps/server/internal/hostprogram/materializationdemo
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Keep interactive article index off blocking path'
            git push
          fi
