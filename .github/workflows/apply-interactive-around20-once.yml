name: apply-interactive-around20-once

on:
  push:
    branches:
      - feat/interactive-boards-around-20
    paths:
      - .github/workflows/apply-interactive-around20-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-boards-around-20
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: python3 scripts/apply_interactive_around20.py
      - name: Format
        run: |
          cd apps/server
          gofmt -w \
            internal/worldrepo/materialization_interactive_title_first.go \
            internal/worldrepo/materialization_conversation_view.go \
            internal/worldrepo/materialization_demo_persona.go \
            internal/worldrepo/materialization_demo_dense.go \
            internal/worldrepo/materialization_interactive_board.go \
            internal/worldrepo/materialization_interactive_title_refill.go \
            internal/worldrepo/materialization_interactive_title_first_test.go \
            internal/worldrepo/materialization_interactive_scale_test.go
      - name: Test
        run: |
          cd apps/server
          go test ./...
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/internal/worldrepo docs/MATERIALIZATION_LAB.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Increase interactive board observation sample'
            git push
          fi
