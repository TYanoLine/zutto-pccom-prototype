name: fix-article-detail-metadata
on:
  push:
    branches:
      - fix/article-detail-no-header-metadata
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/article-detail-no-header-metadata
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: python3 .github/scripts/fix_article_detail_metadata.py
      - name: Format and test
        run: |
          gofmt -w apps/server/internal/llm/bbs_title_article_details.go apps/server/internal/llm/bbs_title_article_details_test.go apps/server/internal/worldrepo/materialization_interactive_detail.go apps/server/internal/worldrepo/materialization_interactive_latency_test.go
          cd apps/server
          go test ./...
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Reject article header metadata from canonical details'
          git push
