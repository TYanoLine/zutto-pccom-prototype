name: Apply concrete-name canonicalization fix
on:
  push:
    branches: [fix/model-memory-concrete-canonicalize-names-20260908]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-memory-concrete-canonicalize-names-20260908
          fetch-depth: 0
      - name: Patch and test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1))

          path = 'apps/server/internal/llm/openai_world_situation_proposer.go'
          old = '''\t\tif req.PreferConcreteHistoricalNames {\n\t\t\treturn "- This model-memory concrete-name experiment intentionally supplies no proper-noun dictionary or referent list. When an ALREADY-SELECTED situation naturally corresponds to a real product/work/service/company/person/place/event/news/cultural reference that you are confident existed and was knowable in Japan by the world date, PREFER that concrete historical name over a generic label. This is a concretization preference, not a quota: never change the selected topic in order to use a name, never add names as period decoration, and do not repeat one favorite name across unrelated roots. If uncertain about existence, timing, identity or details, stay generic. Do not infer persona ownership/experience merely from a real thing's existence."\n\t\t}\n'''
          new = '''\t\tif req.PreferConcreteHistoricalNames {\n\t\t\treturn "- This model-memory concrete-name experiment intentionally supplies no proper-noun dictionary or referent list. IMPORTANT CANONICALIZATION RULE: this Situation-proposal pass is itself the step that creates new canonical world state for each standalone root. Therefore, when the already-selected situation naturally corresponds to a real product/work/service/company/person/place/event/news/cultural reference that you are confident existed and was knowable in Japan by the event date, PREFER that concrete historical name over a generic label. It is valid for this new canonical occurrence to establish that the selected actor played, used, read, watched, heard, visited, or talked about that named thing when that involvement is the modest event being proposed; no earlier actor-use fact is required for that new occurrence. This does NOT establish persistent ownership, purchase history, long-term preference, compatibility, or unrelated biography. This is a concretization preference, not a quota: never change the selected topic in order to use a name, never add names as period decoration, and do not repeat one favorite name across unrelated roots. If uncertain about existence, timing, identity or details, stay generic. Do not put a generic 'do not name the title/product/device' constraint in must_not merely because no dictionary was supplied; if you choose a real name, use must_not only to prevent unsupported extra details about it."\n\t\t}\n'''
          replace(path, old, new)

          path = 'apps/server/internal/worldrepo/llm_materializer.go'
          old = '''\t\t\treturn "HISTORICAL_REFERENCES=MODEL_MEMORY_CONCRETE_NAME_EXPERIMENT. This fresh-Lab run intentionally supplies NO proper-noun dictionary or referent list. Use your own historical knowledge only for things you are confident existed and were knowable in Japan on or before the supplied world date. CONCRETE-NAME PREFERENCE: when the already-selected canonical situation naturally corresponds to a real product, work, service, company, person, place, event, news item, seasonal or cultural reference that you confidently know, prefer that concrete historical name over a generic label such as 'game', 'word processor', 'communication service' or 'music'. This is a concretization preference, NOT a quota or topic-selection rule: never redirect an event toward a remembered name, never insert a name as decoration, and do not repeat one favored name across unrelated posts. If timing, identity, availability, ownership, compatibility, price, specifications, plot, event details or any other factual detail is uncertain, omit it or stay generic rather than guessing. A real thing's existence does NOT establish that this persona owned, used, watched, bought or experienced it; actor-specific facts still require canonical world state. Do not invent BBS-internal history, posts, logs or SYSOP actions. Keep fictional host facts separate from real history.\\\\n" + llm.DiegeticWorldFrame\n'''
          new = '''\t\t\treturn "HISTORICAL_REFERENCES=MODEL_MEMORY_CONCRETE_NAME_EXPERIMENT. This fresh-Lab run intentionally supplies NO proper-noun dictionary or referent list. Use your own historical knowledge only for things you are confident existed and were knowable in Japan on or before the supplied world date. CONCRETE-NAME PREFERENCE: when the already-selected canonical situation naturally corresponds to a real product, work, service, company, person, place, event, news item, seasonal or cultural reference that you confidently know, prefer that concrete historical name over a generic label such as 'game', 'word processor', 'communication service' or 'music'. The Situation proposal is allowed to establish a modest NEW canonical occurrence in which the selected actor played, used, read, watched, heard, visited, or discussed that named thing; prior actor-use evidence is not required for the new occurrence itself. Do not extrapolate from that occurrence to persistent ownership, purchase history, long-term preference, compatibility, or unrelated biography. This is a concretization preference, NOT a quota or topic-selection rule: never redirect an event toward a remembered name, never insert a name as decoration, and do not repeat one favored name across unrelated posts. If timing, identity, availability, price, specifications, plot, event details or any other factual detail is uncertain, omit it or stay generic rather than guessing. Once canonical Situation facts contain a real name, preserve that canonical name in article prose instead of generalizing it away. Do not invent BBS-internal history, posts, logs or SYSOP actions. Keep fictional host facts separate from real history.\\\\n" + llm.DiegeticWorldFrame\n'''
          replace(path, old, new)

          path = 'apps/server/internal/llm/openai_world_situation_proposer_policy_test.go'
          p = Path(path)
          s = p.read_text()
          old = '''\tif !strings.Contains(got, "not a quota") {\n\t\tt.Fatalf("anti-quota boundary missing: %s", got)\n\t}\n}\n'''
          new = '''\tif !strings.Contains(got, "not a quota") {\n\t\tt.Fatalf("anti-quota boundary missing: %s", got)\n\t}\n\tif !strings.Contains(got, "creates new canonical world state") {\n\t\tt.Fatalf("canonicalization boundary missing: %s", got)\n\t}\n\tif !strings.Contains(got, "no earlier actor-use fact is required") {\n\t\tt.Fatalf("new actor occurrence permission missing: %s", got)\n\t}\n\tif !strings.Contains(got, "Do not put a generic 'do not name") {\n\t\tt.Fatalf("must_not anti-suppression rule missing: %s", got)\n\t}\n}\n'''
          if old not in s:
              raise SystemExit('policy test insertion pattern not found')
          p.write_text(s.replace(old, new, 1))

          path = 'apps/server/internal/worldrepo/model_memory_historical_test.go'
          p = Path(path)
          s = p.read_text()
          old = '''\tif !strings.Contains(rules, "prefer that concrete historical name") {\n\t\tt.Fatalf("concrete-name preference missing: %s", rules)\n\t}\n}\n'''
          new = '''\tif !strings.Contains(rules, "prefer that concrete historical name") {\n\t\tt.Fatalf("concrete-name preference missing: %s", rules)\n\t}\n\tif !strings.Contains(rules, "prior actor-use evidence is not required") {\n\t\tt.Fatalf("new canonical actor occurrence permission missing: %s", rules)\n\t}\n\tif !strings.Contains(rules, "preserve that canonical name") {\n\t\tt.Fatalf("article name-preservation rule missing: %s", rules)\n\t}\n}\n'''
          if old not in s:
              raise SystemExit('worldrepo test insertion pattern not found')
          p.write_text(s.replace(old, new, 1))

          path = 'docs/research/HISTORICAL_TEXTURE_POC.md'
          p = Path(path)
          s = p.read_text()
          s += '''\n\n### Concrete-name first-run finding (2026-09-08)\n\nThe first `model-memory-concrete` 6-board/37-article run (`lab-fresh-1788872387-0001`) still produced essentially no real proper nouns. Inspection showed the Situation proposer repeatedly generated `must_not` constraints such as "特定タイトルや機種を補わない". The prompt had incorrectly implied that actor use/experience of a remembered real object required pre-existing canonical actor state, even though the Situation-proposal pass is precisely the step that creates the new canonical occurrence.\n\nThe follow-up policy therefore distinguishes **new occurrence canonicalization** from **persistent biography inference**: a proposed root may canonically establish that its selected actor played/used/read/watched/heard/visited/discussed a confidently known period-correct named thing, while ownership, purchase history, long-term preference, compatibility and unrelated biography remain unsupported unless separately established. Generic `must_not` bans on naming are not appropriate merely because the mode supplies no dictionary.\n'''
          p.write_text(s)
          PY
          gofmt -w apps/server/internal/llm/openai_world_situation_proposer.go apps/server/internal/llm/openai_world_situation_proposer_policy_test.go apps/server/internal/worldrepo/llm_materializer.go apps/server/internal/worldrepo/model_memory_historical_test.go
          cd apps/server
          go test ./...
          cd ../..
          rm .github/workflows/apply-model-memory-concrete-canonicalization.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Allow named objects in new canonical situations'
          git push origin HEAD:fix/model-memory-concrete-canonicalize-names-20260908