name: patch-title-detail-quality-once
on:
  push:
    branches: [fix/title-article-detail-quality]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run title detail quality patch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/title-article-detail-quality
      - run: python3 .github/scripts/patch_title_detail_quality.py
      - run: gofmt -w apps/server/internal/llm/bbs_title_candidates.go apps/server/internal/llm/bbs_title_article_details.go apps/server/internal/llm/bbs_title_article_details_test.go apps/server/internal/llm/openai.go apps/server/internal/worldrepo/materialization_title_first.go apps/server/internal/worldrepo/materialization_title_first_test.go apps/server/internal/worldrepo/materialization_sparse_situation.go apps/server/internal/worldrepo/materialization_title_reply_source_test.go
      - name: Test server
        working-directory: apps/server
        run: go test ./...
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/internal/llm/bbs_title_candidates.go apps/server/internal/llm/bbs_title_article_details.go apps/server/internal/llm/bbs_title_article_details_test.go apps/server/internal/llm/openai.go apps/server/internal/worldrepo/materialization_title_first.go apps/server/internal/worldrepo/materialization_title_first_test.go apps/server/internal/worldrepo/materialization_sparse_situation.go apps/server/internal/worldrepo/materialization_title_reply_source_test.go docs/MATERIALIZATION_LAB.md
          git commit -m 'Separate concrete article details from title review'
          git push origin HEAD:fix/title-article-detail-quality
