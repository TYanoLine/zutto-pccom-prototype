name: Apply search grounding error diagnostics
on:
  push:
    branches: [fix/search-grounding-error-diagnostics-20260909b]
    paths:
      - .github/scripts/apply_search_grounding_error_diagnostics.py
      - .github/workflows/apply-search-grounding-error-diagnostics.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-grounding-error-diagnostics-20260909b
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply diagnostic patch
        run: python3 .github/scripts/apply_search_grounding_error_diagnostics.py
      - name: Format and test
        run: |
          gofmt -w apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_test.go
          cd apps/server
          go test ./...
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_test.go
          git commit -m 'Expose search grounding errors in fresh Lab diagnostics'
          git push
