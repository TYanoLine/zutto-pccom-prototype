name: run-materialization-lab-viewer-patch
on:
  push:
    branches:
      - feature/materialization-lab-readonly-viewer-20260908
    paths:
      - .github/scripts/apply_materialization_lab_viewer.py
      - .github/workflows/run-materialization-lab-viewer-patch.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/materialization-lab-readonly-viewer-20260908
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply viewer patch
        run: python3 .github/scripts/apply_materialization_lab_viewer.py
      - name: Format and test server
        run: |
          cd apps/server
          gofmt -w cmd/server/materialization_lab.go cmd/server/main.go cmd/server/materialization_lab_fresh.go cmd/server/materialization_lab_fresh_archive.go cmd/server/materialization_lab_fresh_archive_test.go
          go test ./...
      - name: Build and test web
        run: |
          cd apps/web
          npm ci
          npm test
          npm run build
      - name: Commit patch and remove helper files
        run: |
          rm .github/scripts/apply_materialization_lab_viewer.py .github/workflows/run-materialization-lab-viewer-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add read-only materialization Lab viewer'
          git push origin HEAD:feature/materialization-lab-readonly-viewer-20260908
