name: rerun-article-worker-ab-once
on:
  push:
    branches:
      - ops/rerun-article-worker-ab-after-106
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compare one root per board
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://zutto-pccom-prototype.onrender.com'
          curl -sS --fail-with-body "$BASE/api/debug/export?phone=0450000196" > /tmp/export.json
          python3 - <<'PY' > /tmp/cases.tsv
          import json
          data=json.load(open('/tmp/export.json'))
          by={}
          for p in data.get('posts',[]):
              if p.get('parent_id',0)!=0: continue
              bid=str(p.get('board_id',''))
              if not bid: continue
              by[bid]=p
          for bid in sorted(by, key=lambda x:int(x) if x.isdigit() else 999):
              p=by[bid]
              print(f"{bid}\t{p['id']}\t{p.get('subject','')}")
          PY
          echo CASES_BEGIN
          cat /tmp/cases.tsv
          echo CASES_END
          while IFS=$'\t' read -r BOARD POST SUBJECT; do
            echo "AB_BEGIN board=$BOARD post=$POST subject=$SUBJECT"
            curl -sS --fail-with-body "$BASE/api/debug/article-worker-ab?phone=0450000196&board=$BOARD&post=$POST"
            echo
            echo "AB_END board=$BOARD post=$POST"
          done < /tmp/cases.tsv
