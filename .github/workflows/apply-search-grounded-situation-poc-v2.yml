name: Apply search-grounded Situation PoC v2
on:
  push:
    branches: [feature/search-grounded-situation-poc-20260908]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-grounded-situation-poc-20260908
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          patch('apps/server/internal/worldrepo/materialization_batch_situation.go', '\tmustNot          []string\n}', '\tmustNot          []string\n\tgroundingEvidence []string\n}')
          patch('apps/server/internal/worldrepo/materialization_batch_situation.go', '\tstats := value.(developmentBatchSituationStats)\n\treturn fmt.Sprintf("roots=%d proposal_calls=%d rejected=%d repair_calls=%d", stats.Roots, stats.ProposalCalls, stats.Rejected, stats.RepairCalls)', '\tstats := value.(developmentBatchSituationStats)\n\tbase := fmt.Sprintf("roots=%d proposal_calls=%d rejected=%d repair_calls=%d", stats.Roots, stats.ProposalCalls, stats.Rejected, stats.RepairCalls)\n\tif extra := developmentSearchGroundingDiagnostic(r, hostID); extra != "" {\n\t\treturn base + " " + extra\n\t}\n\treturn base')
          patch('apps/server/internal/worldrepo/materialization_batch_situation.go', '\t\tfor id, proposal := range repaired {\n\t\t\taccepted[id] = proposal\n\t\t}\n\t}\n\n\tstoreDevelopmentPlanningUsage(r, host.ID, "situation-window", usage)', '\t\tfor id, proposal := range repaired {\n\t\t\taccepted[id] = proposal\n\t\t}\n\t}\n\n\tif developmentSearchGroundingPoCEnabled(r) {\n\t\tvar groundingUsage GenerationUsage\n\t\taccepted, groundingUsage = r.developmentSearchGroundSituations(host, roots, accepted, factsByPersona)\n\t\tusage = addDevelopmentGenerationUsage(usage, groundingUsage)\n\t}\n\n\tstoreDevelopmentPlanningUsage(r, host.ID, "situation-window", usage)')
          patch('apps/server/internal/worldrepo/materialization_batch_situation.go', '\tfor _, value := range p.mustNot {', '\tfor _, value := range p.groundingEvidence {\n\t\tif strings.TrimSpace(value) != "" {\n\t\t\tfacts = append(facts, "historical_grounding="+strings.TrimSpace(value))\n\t\t}\n\t}\n\tfor _, value := range p.mustNot {')

          patch('apps/server/internal/worldrepo/llm_materializer.go', '\t// PreferConcreteHistoricalNames keeps model-memory dictionary-free while preferring a known real name over a generic label when it naturally fits.\n\tPreferConcreteHistoricalNames bool\n}', '\t// PreferConcreteHistoricalNames keeps model-memory dictionary-free while preferring a known real name over a generic label when it naturally fits.\n\tPreferConcreteHistoricalNames bool\n\t// SearchGroundedHistoricalReferences is a fresh-Lab experiment: real names may enter only through searched canonical Situation evidence.\n\tSearchGroundedHistoricalReferences bool\n}')
          patch('apps/server/internal/worldrepo/llm_materializer.go', 'func (m LLMMaterializer) eraRules() string {\n\tif m.ModelHistoricalMemory {', 'func (m LLMMaterializer) eraRules() string {\n\tif m.SearchGroundedHistoricalReferences {\n\t\treturn "HISTORICAL_REFERENCES=SEARCH_GROUNDED_EXPERIMENT. Do not introduce new real product/work/service/company/person/place/event names from model memory. A real name already present in canonical Situation/PostIntent was selected only after bounded historical search and is an allowed canonical referent: preserve it in subject/body instead of generalizing it away. Do not add release dates, prices, specifications, plot, popularity, ownership history or other details unless they are explicitly canonical. Unnamed situations should remain unnamed. Never use anything after the supplied world date.\\n" + llm.DiegeticWorldFrame\n\t}\n\tif m.ModelHistoricalMemory {')

          patch('apps/server/internal/llm/openai_world_situation_proposer.go', '%s\n- SUPPLIED HISTORICAL TEXTURE is permission and contemporaneous background, not a topic menu.', '%s\n- SEARCH-GROUNDED RETRY: an event may contain existing_facts beginning "GROUNDING ORIGINAL SITUATION - PRESERVE SEMANTICS:" and "GROUNDING VERIFIED HISTORICAL EVIDENCE - ALLOWED REAL REFERENTS:". For such an event, this pass is NOT permission to invent a different situation. Preserve the original activity, change, actor observation, impact, uncertainty and novelty_key. Use at most one searched real referent only when the supplied evidence genuinely fits that exact generic object; naming that object is preferred over repeating the generic label. The searched evidence verifies historical availability, while this world-Situation pass decides the modest actor involvement. Do not turn alternative candidates into multiple events. If no candidate cleanly fits, keep the original generic object. Never emit a must_not rule that forbids a real name explicitly permitted by grounding evidence.\n- SUPPLIED HISTORICAL TEXTURE is permission and contemporaneous background, not a topic menu.')

          patch('apps/server/cmd/server/materialization_lab_fresh.go', '\tcase "model-memory-concrete":\n\t\treturn "model-memory-concrete", true\n\tcase "1996-08-curated":', '\tcase "model-memory-concrete":\n\t\treturn "model-memory-concrete", true\n\tcase "search-grounded":\n\t\treturn "search-grounded", true\n\tcase "1996-08-curated":')
          patch('apps/server/cmd/server/materialization_lab_fresh.go', '{"error": "historical_texture must be sourced, off, model-memory, model-memory-concrete or 1996-08-curated"}', '{"error": "historical_texture must be sourced, off, model-memory, model-memory-concrete, search-grounded or 1996-08-curated"}')
          patch('apps/server/cmd/server/materialization_lab_fresh.go', '\thistoricalTexture, ok := normalizeFreshHistoricalTexture(r.URL.Query().Get("historical_texture"))\n\tif !ok {\n\t\tw.WriteHeader(http.StatusBadRequest)\n\t\t_ = json.NewEncoder(w).Encode(map[string]string{"error": "historical_texture must be sourced, off, model-memory, model-memory-concrete, search-grounded or 1996-08-curated"})\n\t\treturn\n\t}\n\tboardCount, ok :=', '\thistoricalTexture, ok := normalizeFreshHistoricalTexture(r.URL.Query().Get("historical_texture"))\n\tif !ok {\n\t\tw.WriteHeader(http.StatusBadRequest)\n\t\t_ = json.NewEncoder(w).Encode(map[string]string{"error": "historical_texture must be sourced, off, model-memory, model-memory-concrete, search-grounded or 1996-08-curated"})\n\t\treturn\n\t}\n\tif historicalTexture == "search-grounded" && situationMode != "batch" {\n\t\tw.WriteHeader(http.StatusBadRequest)\n\t\t_ = json.NewEncoder(w).Encode(map[string]string{"error": "search-grounded requires situation_mode=batch"})\n\t\treturn\n\t}\n\tboardCount, ok :=')
          patch('apps/server/cmd/server/materialization_lab_fresh.go', '\t\tm.PreferConcreteHistoricalNames = job.HistoricalTexture == "model-memory-concrete"\n\t\tm.HistoricalReferencesEnabled = false', '\t\tm.PreferConcreteHistoricalNames = job.HistoricalTexture == "model-memory-concrete"\n\t\tm.SearchGroundedHistoricalReferences = job.HistoricalTexture == "search-grounded"\n\t\tm.HistoricalReferencesEnabled = false')
          patch('apps/server/cmd/server/materialization_lab_fresh.go', '\tif job.SituationMode == "batch" {\n\t\trepo.EnableDevelopmentBatchSituationPoC()\n\t}\n\thost, err :=', '\tif job.SituationMode == "batch" {\n\t\trepo.EnableDevelopmentBatchSituationPoC()\n\t}\n\tif job.HistoricalTexture == "search-grounded" {\n\t\trepo.EnableDevelopmentSearchGroundingPoC()\n\t}\n\thost, err :=')
          PY
          gofmt -w apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_test.go apps/server/internal/worldrepo/materialization_batch_situation.go apps/server/internal/worldrepo/llm_materializer.go apps/server/internal/llm/openai_world_situation_proposer.go apps/server/cmd/server/materialization_lab_fresh.go
          cd apps/server && go test ./...
      - name: Commit source and remove helper workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-search-grounded-situation-poc.yml .github/workflows/apply-search-grounded-situation-poc-v2.yml
          git add -A
          git commit -m 'Wire web search into canonical Situation grounding'
          git push origin HEAD:feature/search-grounded-situation-poc-20260908
