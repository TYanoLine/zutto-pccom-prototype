name: Root Discourse Mix Patcher

on:
  push:
    branches:
      - fix/root-discourse-mix-20260907
    paths:
      - .github/workflows/root-discourse-mix-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/root-discourse-mix-20260907
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Apply patch
        run: python3 scripts/apply_root_discourse_mix.py
      - name: Format
        run: gofmt -w apps/server/internal/world/models.go apps/server/internal/llm/provider.go apps/server/internal/worldrepo/materialization_intent_planner.go apps/server/internal/worldrepo/materialization_action_seed.go apps/server/internal/worldrepo/materialization_world_window_producer.go apps/server/internal/worldrepo/materialization_demo_persona.go apps/server/internal/worldrepo/llm_materializer.go apps/server/internal/llm/structured_board_worker.go apps/server/internal/llm/openai_world_window_producer.go apps/server/internal/llm/openai.go apps/server/cmd/server/materialization_lab_fresh.go apps/server/internal/worldrepo/materialization_discourse_mode_test.go
      - name: Test server
        working-directory: apps/server
        run: go test ./...
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/root-discourse-mix-patch.yml scripts/apply_root_discourse_mix.py
          git add apps/server docs/WORLD_WINDOW_PRODUCER.md
          git commit -m "Diversify root post discourse modes"
          git push origin HEAD:fix/root-discourse-mix-20260907
