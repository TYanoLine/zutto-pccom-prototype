name: Apply search-grounding world selection
on:
  push:
    branches: [fix/search-grounding-world-selection-20260909]
    paths: [.github/workflows/apply-search-grounding-world-selection.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-grounding-world-selection-20260909
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Patch and test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('apps/server/internal/worldrepo/materialization_search_grounding.go')
          s = p.read_text()
          s = s.replace('''type developmentSearchGroundingStats struct {\n\tQueries        int\n\tEvidenceHits   int\n\tRefined        int\n\tRejected       int\n\tSearchFailures int\n\tRefineFailures int\n}''','''type developmentSearchGroundingStats struct {\n\tQueries          int\n\tEvidenceHits     int\n\tCandidateOptions int\n\tSelections       int\n\tRefined          int\n\tRejected         int\n\tSearchFailures   int\n\tRefineFailures   int\n}''')
          s = s.replace('''return fmt.Sprintf("search_queries=%d search_hits=%d grounded_refinements=%d grounding_rejected=%d search_failures=%d refine_failures=%d", stats.Queries, stats.EvidenceHits, stats.Refined, stats.Rejected, stats.SearchFailures, stats.RefineFailures)''','''return fmt.Sprintf("search_queries=%d search_hits=%d candidate_options=%d grounded_selections=%d grounded_refinements=%d grounding_rejected=%d search_failures=%d refine_failures=%d", stats.Queries, stats.EvidenceHits, stats.CandidateOptions, stats.Selections, stats.Refined, stats.Rejected, stats.SearchFailures, stats.RefineFailures)''')
          s = s.replace('''\tgrounding := map[string][]string{}\n\tvar mu sync.Mutex''','''\toptionsByEvent := map[string][]developmentGroundingCandidate{}\n\tvar mu sync.Mutex''')
          s = s.replace('''\t\t\tdecision, err := r.Engine.ResolveEvidence(ctx, developmentSearchGroundingEvidenceRequest(item, proposal))''','''\t\t\tdecision, err := r.Engine.ResolveEvidence(ctx, developmentSearchGroundingEvidenceRequest(item, proposal, factsByPersona[item.shell.persona.ID]))''')
          s = s.replace('''\t\t\tevidence := developmentUsableGroundingClaims(decision.Knowledge)\n\t\t\tif len(evidence) == 0 {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tmu.Lock()\n\t\t\tstats.EvidenceHits++\n\t\t\tgrounding[item.eventID] = evidence\n\t\t\tmu.Unlock()''','''\t\t\toptions := developmentGroundingCandidatesFromKnowledge(decision.Knowledge)\n\t\t\tif len(options) == 0 {\n\t\t\t\treturn\n\t\t\t}\n\t\t\tmu.Lock()\n\t\t\tstats.EvidenceHits++\n\t\t\tstats.CandidateOptions += len(options)\n\t\t\toptionsByEvent[item.eventID] = options\n\t\t\tmu.Unlock()''')
          s = s.replace('''\twg.Wait()\n\tif len(grounding) == 0 {\n\t\tstoreStats()\n\t\treturn accepted, GenerationUsage{}\n\t}\n\n\trefineRoots := make([]developmentWindowShell, 0, len(grounding))\n\tfor _, root := range roots {\n\t\tif len(grounding[root.eventID]) > 0 {\n\t\t\trefineRoots = append(refineRoots, root)\n\t\t}\n\t}''','''\twg.Wait()\n\tif len(optionsByEvent) == 0 {\n\t\tstoreStats()\n\t\treturn accepted, GenerationUsage{}\n\t}\n\n\tgrounding := map[string][]string{}\n\tselectedNames := map[string]int{}\n\trecentPosts := r.Base.ListPosts(host.ID)\n\trefineRoots := make([]developmentWindowShell, 0, len(optionsByEvent))\n\tfor _, root := range roots {\n\t\toptions := optionsByEvent[root.eventID]\n\t\tif len(options) == 0 {\n\t\t\tcontinue\n\t\t}\n\t\tselected, ok := developmentSelectGroundingCandidate(host.ID, root, options, recentPosts, selectedNames)\n\t\tif !ok {\n\t\t\tcontinue\n\t\t}\n\t\tselectedNames[developmentNormalizeReferentName(selected.Name)]++\n\t\tstats.Selections++\n\t\tgrounding[root.eventID] = []string{developmentSelectedGroundingEvidence(selected)}\n\t\trefineRoots = append(refineRoots, root)\n\t}\n\tif len(refineRoots) == 0 {\n\t\tstoreStats()\n\t\treturn accepted, GenerationUsage{}\n\t}''')
          s = s.replace('''\t\trefined, found := plan.proposals[root.eventID]\n\t\tif !found || !developmentSearchGroundingCompatible(original, refined) {''','''\t\trefined, found := plan.proposals[root.eventID]\n\t\tselectedName := developmentSelectedGroundingName(grounding[root.eventID])\n\t\tif !found || !developmentSearchGroundingCompatible(original, refined) || !developmentRefinementUsesSelectedReferent(refined, selectedName) {''')

          start = s.index('func developmentSearchGroundingEvidenceRequest(')
          end = s.index('\nfunc developmentUsableGroundingClaims', start)
          newfunc = r'''func developmentSearchGroundingEvidenceRequest(root developmentWindowShell, proposal developmentSituationProposal, personaFacts []world.PersonaFact) worldengine.EvidenceRequest {
\tkind := historicalkb.KnowledgeGeneral
\tswitch strings.ToLower(strings.TrimSpace(root.shell.anchorKey)) {
\tcase "games", "software", "communications", "modem":
\t\tkind = historicalkb.KnowledgeProductAvailability
\tcase "music":
\t\tkind = historicalkb.KnowledgeCulturalSignal
\t}
\tworldDate := root.shell.createdAt.Format("2006-01-02")
\tactorContext := developmentGroundingActorContext(root.shell.persona, personaFacts)
\tneed := fmt.Sprintf("次の架空BBS内の出来事の種類・行動・観察はworld engineが既に選択済みです。あなたの役割は、この出来事を%s時点の日本の現実世界へ自然に接地できる実在の製品・作品・サービス・機種・番組・曲などの候補集合をWeb検索で作ることです。重要: これは過去の正解を推理する検索ではありません。候補のうちどれが今回このNPCの世界事実になるかは、この後world engineが決定します。したがってoriginal Situationから一意に名前を推理できる必要はありません。出来事の意味を変えず、その日までに日本で利用・発売・稼働・放送・鑑賞・言及可能で、普通にこの出来事の対象になり得る候補を2〜5件返してください。候補はできるだけ公式資料・当時資料・信頼できる保存資料で存在時期を確認してください。候補名は当時の利用者が会話で自然に使う短い正式名または一般的名称にしてください。人気作だけに偏らず、actor contextやboard contextに自然に合う順で並べてください。ただしactorが所有・購入・視聴・プレイした事実は推測しないでください。候補はその可能性を提供するだけです。各候補はProvisionalAnswer内で必ず独立した行に `CANDIDATE: 名前 || その日までの存在/利用可能性と、このgeneric Situationに意味を変えず適合する短い根拠` の厳密な形式で書いてください。候補が本当に作れない場合だけ `NO_CANDIDATE: 理由` としてください。単に候補が複数あることはNO_CANDIDATEの理由ではありません。必要な歴史条件が裏付けられた候補だけを出し、その場合missingInfoは空配列にしてください。NPCの今回の関与、所有歴、長期嗜好、個別店舗在庫、主観的結果は検索スコープ外なのでmissingInfoへ入れないでください。board=%s; actor_context=%s; object=%s; occurrence=%s; actor_observation=%s", worldDate, root.board.Name, actorContext, proposal.objectClass, proposal.occurrence, proposal.actorObservation)
\treturn worldengine.EvidenceRequest{
\t\tKind:            kind,
\t\tSubject:         proposal.objectClass + " / " + proposal.noveltyKey + " / candidate-pool-v1",
\t\tWorldDate:       worldDate,
\t\tRegion:          "JP",
\t\tAudience:        []string{"Japanese PC communication users"},
\t\tNeed:            need,
\t\tPersistence:     true,
\t\tImportance:      .7,
\t\tSpecificity:     .9,
\t\tHasProductModel: true,
\t}
}
'''
          s = s[:start] + newfunc + s[end:]
          p.write_text(s)

          p = Path('apps/server/internal/llm/openai_world_situation_proposer.go')
          s = p.read_text()
          old = '''- SEARCH-GROUNDED RETRY: an event may contain existing_facts beginning "GROUNDING ORIGINAL SITUATION - PRESERVE SEMANTICS:" and "GROUNDING VERIFIED HISTORICAL EVIDENCE - ALLOWED REAL REFERENTS:". For such an event, this pass is NOT permission to invent a different situation. Preserve the original activity, change, actor observation, impact, uncertainty and novelty_key. Use at most one searched real referent only when the ORIGINAL SITUATION contains discriminating semantic clues that make that referent materially better identified than ordinary contemporary alternatives. Historical availability or mere plausibility is not enough. Do NOT choose one name from a menu of unrelated candidates just to make prose concrete. If two or more unrelated candidates fit the original event about equally well, keep the original generic object. Likewise, if the evidence presents a named thing only as one possible example of a broad activity, keep it generic. Naming is allowed only when the original object/activity plus occurrence/observation narrow the identity or a historically meaningful small class; otherwise omission is the correct result. The searched evidence verifies historical availability, while this world-Situation pass decides the modest actor involvement. Do not turn alternative candidates into multiple events. If no candidate is discriminatively supported, keep the original generic object. Never emit a must_not rule that forbids a real name explicitly permitted by grounding evidence.'''
          new = '''- SEARCH-GROUNDED RETRY: an event may contain existing_facts beginning "GROUNDING ORIGINAL SITUATION - PRESERVE SEMANTICS:" and "GROUNDING WORLD-SELECTED REFERENT - MUST USE:". For such an event, the search stage has already produced historically valid candidates and the Go world layer has already selected exactly one referent as the new world fact for this event. You MUST use that selected referent to replace the generic object while preserving the original activity, change, actor observation, impact, uncertainty and novelty_key. Do not choose an alternative candidate and do not fall back to a generic label merely because the original Situation did not uniquely imply the name; this is creation of a new canonical fact, not reconstruction of a hidden past fact. The selected actor may modestly play, use, hear, watch, read, visit or discuss that referent as required by the original occurrence. This does not establish ownership, purchase history, long-term fandom, unrelated biography or extra product facts. Never emit a must_not rule forbidding the selected referent; use must_not only to prevent unsupported extra details.'''
          if old not in s:
              raise SystemExit('search-grounded prompt block not found')
          p.write_text(s.replace(old, new))

          p = Path('apps/server/internal/worldrepo/materialization_search_grounding_test.go')
          s = p.read_text()
          s = s.replace('developmentSearchGroundingEvidenceRequest(root, proposal)', 'developmentSearchGroundingEvidenceRequest(root, proposal, nil)')
          s = s.replace('''for _, want := range []string{"missingInfo", "NPCが実際に使った", "検索スコープ外", "空配列"} {''','''for _, want := range []string{"missingInfo", "world engineが決定", "CANDIDATE:", "candidate-pool-v1"} {''')
          s += r'''

func TestDevelopmentGroundingCandidateParser(t *testing.T) {
\tclaim := "CANDIDATE: MYST || 1994年発売で探索停滞の出来事に適合\nCANDIDATE: 弟切草 || 1992年発売で選択肢のある遊びに適合"
\tgot := developmentParseGroundingCandidates(claim)
\tif len(got) != 2 || got[0].Name != "MYST" || got[1].Name != "弟切草" {
\t\tt.Fatalf("parsed candidates=%+v", got)
\t}
}

func TestDevelopmentSelectGroundingCandidatePenalizesRecentReuse(t *testing.T) {
\tdate := time.Date(1996, 8, 22, 12, 0, 0, 0, time.FixedZone("JST", 9*3600))
\troot := developmentWindowShell{eventID: "e1", shell: developmentTimelineShell{createdAt: date, persona: world.Persona{ID: "p1"}}}
\toptions := []developmentGroundingCandidate{{Name: "MYST", Evidence: "x", Rank: 0}, {Name: "弟切草", Evidence: "y", Rank: 1}}
\trecent := []world.Post{{Subject: "MYSTの話", Body: "MYSTを遊んだ"}}
\tselected, ok := developmentSelectGroundingCandidate("h", root, options, recent, map[string]int{})
\tif !ok || selected.Name != "弟切草" {
\t\tt.Fatalf("selected=%+v ok=%v", selected, ok)
\t}
}
'''
          p.write_text(s)

          Path('apps/server/internal/worldrepo/materialization_search_grounding_selection.go').write_text(r'''package worldrepo

import (
    "fmt"
    "hash/fnv"
    "strings"

    "zutto-pccom/apps/server/internal/historicalkb"
    "zutto-pccom/apps/server/internal/world"
)

type developmentGroundingCandidate struct {
    Name     string
    Evidence string
    Rank     int
}

func developmentGroundingCandidatesFromKnowledge(result historicalkb.KnowledgeResult) []developmentGroundingCandidate {
    if !result.CanUse {
        return nil
    }
    out := make([]developmentGroundingCandidate, 0, 8)
    seen := map[string]struct{}{}
    for _, fact := range result.Facts {
        if fact.Status != historicalkb.FactVerified && fact.Status != historicalkb.FactOperatorVerified && fact.Status != historicalkb.FactCanonical {
            continue
        }
        for _, candidate := range developmentParseGroundingCandidates(fact.Claim) {
            key := developmentNormalizeReferentName(candidate.Name)
            if key == "" {
                continue
            }
            if _, ok := seen[key]; ok {
                continue
            }
            candidate.Rank = len(out)
            seen[key] = struct{}{}
            out = append(out, candidate)
        }
    }
    return out
}

func developmentParseGroundingCandidates(claim string) []developmentGroundingCandidate {
    lines := strings.Split(strings.ReplaceAll(claim, "\r\n", "\n"), "\n")
    out := make([]developmentGroundingCandidate, 0, 5)
    for _, line := range lines {
        line = strings.TrimSpace(strings.TrimLeft(line, "-*• "))
        if !strings.HasPrefix(strings.ToUpper(line), "CANDIDATE:") {
            continue
        }
        rest := strings.TrimSpace(line[len("CANDIDATE:"):])
        parts := strings.SplitN(rest, "||", 2)
        name := strings.TrimSpace(parts[0])
        if name == "" {
            continue
        }
        evidence := ""
        if len(parts) == 2 {
            evidence = strings.TrimSpace(parts[1])
        }
        out = append(out, developmentGroundingCandidate{Name: name, Evidence: evidence, Rank: len(out)})
    }
    return out
}

func developmentGroundingActorContext(persona world.Persona, facts []world.PersonaFact) string {
    parts := []string{personaSummary(persona)}
    for i, fact := range facts {
        if i >= 8 {
            break
        }
        key := strings.TrimSpace(fact.Key)
        value := strings.TrimSpace(fact.Value)
        if key != "" && value != "" {
            parts = append(parts, key+"="+value)
        }
    }
    return strings.Join(parts, "; ")
}

func developmentSelectGroundingCandidate(hostID string, root developmentWindowShell, options []developmentGroundingCandidate, recentPosts []world.Post, selectedNames map[string]int) (developmentGroundingCandidate, bool) {
    if len(options) == 0 {
        return developmentGroundingCandidate{}, false
    }
    best := options[0]
    bestScore := -1 << 30
    for _, option := range options {
        normalized := developmentNormalizeReferentName(option.Name)
        if normalized == "" {
            continue
        }
        score := 1000 - option.Rank*35
        repeats := developmentReferentRecentCount(option.Name, recentPosts)
        score -= repeats * 300
        score -= selectedNames[normalized] * 700
        score += int(developmentStableGroundingHash(hostID+"|"+root.eventID+"|"+root.shell.persona.ID+"|"+option.Name) % 97)
        if score > bestScore {
            bestScore = score
            best = option
        }
    }
    return best, bestScore > (-1 << 30)
}

func developmentReferentRecentCount(name string, posts []world.Post) int {
    normalized := developmentNormalizeReferentName(name)
    if normalized == "" {
        return 0
    }
    count := 0
    for _, post := range posts {
        haystack := developmentNormalizeReferentName(post.Subject + " " + post.Body)
        if strings.Contains(haystack, normalized) {
            count++
        }
    }
    return count
}

func developmentStableGroundingHash(value string) uint32 {
    h := fnv.New32a()
    _, _ = h.Write([]byte(value))
    return h.Sum32()
}

func developmentNormalizeReferentName(value string) string {
    replacer := strings.NewReplacer(" ", "", "　", "", "『", "", "』", "", "「", "", "」", "", "・", "", "-", "", "_", "")
    return strings.ToLower(replacer.Replace(strings.TrimSpace(value)))
}

func developmentSelectedGroundingEvidence(candidate developmentGroundingCandidate) string {
    return fmt.Sprintf("GROUNDING WORLD-SELECTED REFERENT - MUST USE: %s || VERIFIED SEARCH FIT: %s", candidate.Name, candidate.Evidence)
}

func developmentSelectedGroundingName(evidence []string) string {
    const prefix = "GROUNDING WORLD-SELECTED REFERENT - MUST USE:"
    for _, item := range evidence {
        if !strings.HasPrefix(item, prefix) {
            continue
        }
        rest := strings.TrimSpace(strings.TrimPrefix(item, prefix))
        if idx := strings.Index(rest, "||"); idx >= 0 {
            rest = strings.TrimSpace(rest[:idx])
        }
        return rest
    }
    return ""
}

func developmentRefinementUsesSelectedReferent(refined developmentSituationProposal, selected string) bool {
    selected = developmentNormalizeReferentName(selected)
    if selected == "" {
        return false
    }
    combined := developmentNormalizeReferentName(strings.Join([]string{refined.objectClass, refined.occurrence, refined.actorObservation}, " "))
    return strings.Contains(combined, selected)
}
''')
          PY
          gofmt -w apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_selection.go apps/server/internal/worldrepo/materialization_search_grounding_test.go
          cd apps/server
          go test ./...
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_selection.go apps/server/internal/worldrepo/materialization_search_grounding_test.go apps/server/internal/llm/openai_world_situation_proposer.go
          git commit -m 'Let world layer select searched historical referents'
          git push origin HEAD:fix/search-grounding-world-selection-20260909
