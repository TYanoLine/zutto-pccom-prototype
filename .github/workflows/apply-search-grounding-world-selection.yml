name: Apply search grounding world selection
on:
  push:
    branches:
      - "fix/search-grounding-world-selection-20260909"
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/search-grounding-world-selection-20260909"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Patch
        run: python3 .github/scripts/apply_search_grounding_world_selection.py
      - name: Format and test
        run: |
          gofmt -w apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_selection.go apps/server/internal/worldrepo/materialization_search_grounding_test.go
          cd apps/server
          go test ./...
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_selection.go apps/server/internal/worldrepo/materialization_search_grounding_test.go apps/server/internal/llm/openai_world_situation_proposer.go
          git commit -m 'Let world layer select searched historical referents'
          git push origin HEAD:fix/search-grounding-world-selection-20260909
