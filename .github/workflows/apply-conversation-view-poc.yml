name: Apply conversation-view PoC
on:
  push:
    branches:
      - poc/conversation-view-materialization-20260907
    paths:
      - .github/workflows/apply-conversation-view-poc.yml
      - .tmp/apply-conversation-view-poc.py
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: poc/conversation-view-materialization-20260907
      - name: Apply patch
        run: python3 .tmp/apply-conversation-view-poc.py
      - name: Format
        run: gofmt -w apps/server/internal/worldrepo/materialization_demo_persona.go apps/server/internal/worldrepo/materialization_article_debug.go apps/server/internal/worldrepo/materialization_conversation_view.go apps/server/internal/worldrepo/materialization_conversation_view_test.go apps/server/cmd/server/materialization_lab_fresh.go
      - name: Test server
        working-directory: apps/server
        run: go test ./...
      - name: Commit tested patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-conversation-view-poc.yml .tmp/apply-conversation-view-poc.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add conversation-view materialization PoC'
          git push origin HEAD:poc/conversation-view-materialization-20260907
