name: apply-fresh-lab-gemini-viewer
on:
  push:
    branches:
      - fix/fresh-lab-gemini-viewer
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fresh-lab-gemini-viewer
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Patch fresh Lab and viewer
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/server/cmd/server/materialization_lab_fresh_snapshot.go <<'EOF'
          package main

          import "zutto-pccom/apps/server/internal/world"

          // snapshotForFreshWorld captures the development host even when it has
          // no producer posts yet. Fresh Lab is responsible for creating a new
          // isolated conversation, so unlike worker replay it must not require an
          // already-materialized producer event.
          func (l *materializationLab) snapshotForFreshWorld(phone string) (world.DevelopmentHostSnapshot, error) {
              host, err := l.store.HostByPhone(phone)
              if err != nil {
                  return world.DevelopmentHostSnapshot{}, err
              }
              boards := append([]world.Board(nil), l.store.ListBoards(host.ID)...)
              posts := clonePostsForLab(l.store.ListPosts(host.ID))
              personas := append([]world.Persona(nil), l.store.ListHostPersonas(host.ID)...)
              facts := map[string][]world.PersonaFact{}
              memberships := make([]string, 0, len(personas))
              for _, p := range personas {
                  memberships = append(memberships, p.ID)
                  if pf := l.store.ListPersonaFacts(p.ID); len(pf) > 0 {
                      facts[p.ID] = append([]world.PersonaFact(nil), pf...)
                  }
              }
              maxID := int64(0)
              for _, p := range posts {
                  if p.ID > maxID {
                      maxID = p.ID
                  }
              }
              return world.DevelopmentHostSnapshot{
                  SchemaVersion: world.DevelopmentHostSnapshotSchemaVersion,
                  Host: host,
                  Boards: boards,
                  Posts: posts,
                  Personas: personas,
                  PersonaFacts: facts,
                  Memberships: memberships,
                  NextPostID: maxID,
              }, nil
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          p = Path('apps/server/cmd/server/materialization_lab_fresh.go')
          s = p.read_text()
          replacements = [
              ('\tBody                    string    `json:"body"`\n', '\tBody                    string    `json:"body"`\n\tBodyModel               string    `json:"body_model,omitempty"`\n'),
              ('\tsnapshot, _, err := l.snapshotForWorkerReplay(job.Phone, nil)\n', '\tsnapshot, err := l.snapshotForFreshWorld(job.Phone)\n'),
              ('\tarticles := collectMaterializationFreshArticles(posts)\n', '\tarticles := collectMaterializationFreshArticles(posts)\n\tfor i := range articles {\n\t\tusage, _ := repo.MaterializationGenerationUsage(articles[i].ID)\n\t\tarticles[i].BodyModel = usage.Model\n\t}\n'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing fresh.go patch target: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('apps/web/src/poc/MaterializationLabViewerPage.tsx')
          s = p.read_text()
          replacements = [
              ('  subject: string; body: string; action?: string; anchor_key?: string; cause_kind?: string;\n', '  subject: string; body: string; body_model?: string; action?: string; anchor_key?: string; cause_kind?: string;\n'),
              ('  const articles = job?.articles || [];\n', "  const articles = job?.articles || [];\n  const bodyModels = Array.from(new Set(articles.map(a=>a.body_model).filter((m): m is string => !!m))).join(', ');\n"),
              ('        <span>FAIL <b>{job.failures || 0}</b></span><span>TIME <b>{job.duration_ms ? (job.duration_ms/1000).toFixed(1)+\'s\' : \'-\'}</b></span>\n', '        <span>FAIL <b>{job.failures || 0}</b></span><span>TIME <b>{job.duration_ms ? (job.duration_ms/1000).toFixed(1)+\'s\' : \'-\'}</b></span>\n        <span>BODY MODEL <b>{bodyModels || \'未記録\'}</b></span>\n'),
              ('            <div className="postHead"><b>{post.author}</b><span>#{post.id} · {fmt(post.created_at)}</span></div>\n', '            <div className="postHead"><b>{post.author}</b><span>#{post.id} · {fmt(post.created_at)}{post.body_model ? ` · BODY ${post.body_model}` : \'\'}</span></div>\n'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing viewer patch target: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          gofmt -w apps/server/cmd/server/materialization_lab_fresh.go apps/server/cmd/server/materialization_lab_fresh_snapshot.go
          (cd apps/server && go test ./...)
          (cd apps/web && npm ci && npm run build)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/cmd/server/materialization_lab_fresh.go apps/server/cmd/server/materialization_lab_fresh_snapshot.go apps/web/src/poc/MaterializationLabViewerPage.tsx
          git commit -m 'Make fresh Lab self-seeding and show Gemini body model'
          git push origin HEAD:fix/fresh-lab-gemini-viewer
