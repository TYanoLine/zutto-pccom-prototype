name: apply-pending-reply-list-repair-once

on:
  push:
    branches:
      - fix/repair-pending-replies-on-list
    paths:
      - .github/workflows/apply-pending-reply-list-repair-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repair-pending-replies-on-list
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: python3 scripts/apply_pending_reply_list_repair.py
      - name: Format
        run: |
          cd apps/server
          gofmt -w internal/worldrepo/repository.go internal/worldrepo/materialization_reply_subject_test.go
      - name: Test
        run: |
          cd apps/server
          go test ./...
      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/internal/worldrepo
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Repair persisted reply placeholders on ListPosts'
            git push
          fi
