name: port-article-worker-ab-clean
on:
  push:
    branches:
      - feat/article-worker-gemini-ab-clean
jobs:
  port:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/article-worker-gemini-ab-clean
          fetch-depth: 0
      - name: Fetch reference implementation
        run: git fetch origin feat/article-worker-ab:refs/remotes/origin/feat/article-worker-ab
      - name: Copy focused implementation files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .env.example
            apps/server/internal/config/config.go
            apps/server/internal/llm/board_post_prompt.go
            apps/server/internal/llm/board_post_prompt_test.go
            apps/server/internal/llm/gemini.go
            apps/server/internal/llm/openai.go
            apps/server/internal/llm/openai_test.go
            apps/server/internal/llm/period_native_prompt_test.go
            apps/server/internal/llm/structured_board_worker.go
            apps/server/internal/worldrepo/llm_materializer.go
            apps/server/internal/worldrepo/materialization_article_ab.go
            apps/server/internal/worldrepo/materialization_article_debug.go
            apps/server/internal/worldrepo/materialization_worker_context.go
            apps/server/internal/worldrepo/materialization_worker_context_test.go
            apps/server/internal/worldrepo/materialization_worker_debug.go
            apps/server/internal/worldrepo/materialization_bbs_context_test.go
            apps/server/internal/worldrepo/materialization_conversation_view_test.go
            apps/server/cmd/server/article_worker_ab.go
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "origin/feat/article-worker-ab:$f" > "$f"
          done
      - name: Wire provider into server without formatting unrelated code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/server/cmd/server/main.go')
          s=p.read_text()
          old='\tpostRenderer := llm.StructuredOpenAIProvider{OpenAIProvider: llm.OpenAIProvider{APIKey: cfg.OpenAIKey, Model: cfg.OpenAIModel, Client: &http.Client{Timeout: 90 * time.Second}}}\n\tpostMaterializer :='
          new='\tpostRenderer := llm.StructuredOpenAIProvider{OpenAIProvider: llm.OpenAIProvider{APIKey: cfg.OpenAIKey, Model: cfg.OpenAIModel, Client: &http.Client{Timeout: 90 * time.Second}}}\n\tgeminiRenderer := llm.StructuredGeminiProvider{GeminiProvider: llm.GeminiProvider{APIKey: cfg.GeminiKey, Model: cfg.GeminiModel, Client: &http.Client{Timeout: 90 * time.Second}}}\n\tpostMaterializer :='
          if old not in s: raise SystemExit('postRenderer anchor not found')
          s=s.replace(old,new,1)
          old='\tmux.HandleFunc("/api/debug/materialization-lab-fresh-view", materializationLab.freshViewerHandler())\n'
          new=old+'\tmux.HandleFunc("/api/debug/article-worker-ab", newArticleWorkerABHandler(runtimeStore, postMaterializer, geminiRenderer, cfg.GeminiKey != ""))\n'
          if old not in s: raise SystemExit('mux anchor not found')
          s=s.replace(old,new,1)
          old='"openai_model":cfg.OpenAIModel,'
          new='"openai_model":cfg.OpenAIModel,"gemini_model":cfg.GeminiModel,"gemini_article_worker_ab":cfg.GeminiKey!="",'
          if old not in s: raise SystemExit('health anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Test focused implementation
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            apps/server/internal/config/config.go \
            apps/server/internal/llm/board_post_prompt.go \
            apps/server/internal/llm/board_post_prompt_test.go \
            apps/server/internal/llm/gemini.go \
            apps/server/internal/llm/openai.go \
            apps/server/internal/llm/openai_test.go \
            apps/server/internal/llm/period_native_prompt_test.go \
            apps/server/internal/llm/structured_board_worker.go \
            apps/server/internal/worldrepo/llm_materializer.go \
            apps/server/internal/worldrepo/materialization_article_ab.go \
            apps/server/internal/worldrepo/materialization_article_debug.go \
            apps/server/internal/worldrepo/materialization_worker_context.go \
            apps/server/internal/worldrepo/materialization_worker_context_test.go \
            apps/server/internal/worldrepo/materialization_worker_debug.go \
            apps/server/internal/worldrepo/materialization_bbs_context_test.go \
            apps/server/internal/worldrepo/materialization_conversation_view_test.go \
            apps/server/cmd/server/article_worker_ab.go
          cd apps/server
          go test ./...
      - name: Commit clean implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Add compact article worker and Gemini A/B'
          git push
