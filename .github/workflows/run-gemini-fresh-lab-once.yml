name: run-gemini-fresh-lab-once
on:
  push:
    branches:
      - ops/run-gemini-fresh-lab-20260912
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run title-first fresh Lab and verify Gemini body model
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://zutto-pccom-prototype.onrender.com'
          START="$(curl -sS --fail-with-body "$BASE/api/debug/materialization-lab-fresh?action=start&situation_mode=title-first&historical_texture=model-memory&board_count=4&shell_limit=6")"
          JOB_ID="$(jq -r '.id' <<<"$START")"
          test -n "$JOB_ID" && test "$JOB_ID" != null
          echo "JOB_ID=$JOB_ID"

          for i in $(seq 1 180); do
            STATUS="$(curl -sS --fail-with-body "$BASE/api/debug/materialization-lab-fresh?action=status&id=$JOB_ID")"
            STATE="$(jq -r '.status' <<<"$STATUS")"
            if [[ "$STATE" == 'completed' ]]; then
              break
            fi
            if [[ "$STATE" == 'failed' ]]; then
              echo "$STATUS" | jq .
              exit 1
            fi
            if [[ "$i" == 180 ]]; then
              echo "fresh lab timed out" >&2
              echo "$STATUS" | jq .
              exit 1
            fi
            sleep 5
          done

          echo 'RESULT_BEGIN'
          echo "$STATUS" | jq '{id,status,build_commit,situation_mode,historical_texture,board_count,shell_limit,post_count,body_count,failures,usage,error,articles:[.articles[]|{id,board_id,author,subject,body}]}'
          echo 'RESULT_END'
          test "$(jq -r '.body_count // 0' <<<"$STATUS")" -gt 0
          echo "VIEWER=https://zutto-pccom-prototype-liart.vercel.app/poc/materialization-lab-viewer?job=$JOB_ID"
