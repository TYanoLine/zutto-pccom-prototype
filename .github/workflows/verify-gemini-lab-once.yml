name: verify-gemini-lab-once
on:
  push:
    branches:
      - ops/verify-gemini-lab-20260912
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify production Gemini article worker through debug paths
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://zutto-pccom-prototype.onrender.com'

          echo 'Waiting for merged production backend...'
          for i in $(seq 1 60); do
            HEALTH="$(curl -sS --fail-with-body "$BASE/health")"
            RENDERER="$(jq -r '.world_post_renderer // ""' <<<"$HEALTH")"
            GEMINI="$(jq -r '.gemini_configured // false' <<<"$HEALTH")"
            if [[ "$RENDERER" == 'gemini-article-worker-with-openai-planners' && "$GEMINI" == 'true' ]]; then
              echo "HEALTH=$HEALTH"
              break
            fi
            if [[ "$i" == 60 ]]; then
              echo "backend did not reach expected Gemini configuration: $HEALTH" >&2
              exit 1
            fi
            sleep 5
          done

          python -m pip install --quiet 'websockets>=14,<17'
          python - <<'PY'
          import asyncio, json, re
          import websockets

          URI = 'wss://zutto-pccom-prototype.onrender.com/ws'

          async def recv_text(ws):
              raw = await asyncio.wait_for(ws.recv(), timeout=60)
              msg = json.loads(raw)
              return msg.get('text', ''), msg

          async def send_line(ws, line):
              await ws.send(json.dumps({'type':'line','line':line}))
              return await recv_text(ws)

          async def main():
              async with websockets.connect(URI, open_timeout=30, close_timeout=10) as ws:
                  await ws.send(json.dumps({'type':'dial','phone':'0450000196','attempt':1}))
                  dial = json.loads(await asyncio.wait_for(ws.recv(), timeout=60))
                  if dial.get('result') != 'CONNECT':
                      raise RuntimeError(f'dial failed: {dial}')
                  welcome = json.loads(await asyncio.wait_for(ws.recv(), timeout=60))
                  print('DIAL_OK', dial.get('host', {}).get('name', ''))

                  text, _ = await send_line(ws, 'B')
                  if '番号を選択' not in text:
                      raise RuntimeError(f'board list unavailable: {text}')
                  text, _ = await send_line(ws, '1')

                  msg_no = None
                  for _ in range(180):
                      match = re.search(r'(?m)^\s*(\d{4})\s+\d{2}/\d{2}\s+\d{2}:\d{2}', text)
                      if match:
                          msg_no = match.group(1)
                          break
                      await asyncio.sleep(2)
                      text, _ = await send_line(ws, 'R')
                  if not msg_no:
                      raise RuntimeError(f'article index did not become ready: {text}')

                  article, _ = await send_line(ws, msg_no)
                  print('TERMINAL_ARTICLE_BEGIN')
                  print(article)
                  print('TERMINAL_ARTICLE_END')
                  if 'model=gemini-3.8-flash' not in article:
                      raise RuntimeError('article debug output did not report Gemini model')
                  if 'BODY GENERATION FAILED' in article:
                      raise RuntimeError('article body generation failed')

          asyncio.run(main())
          PY

          # The fresh Lab clones already-planned producer state. The terminal pass
          # above primes that state after a new Render process/deploy.
          sleep 65
          START="$(curl -sS --fail-with-body -X POST "$BASE/api/debug/materialization-lab-fresh?action=start&situation_mode=facets&historical_texture=off&board_count=3&shell_limit=1")"
          JOB_ID="$(jq -r '.id' <<<"$START")"
          test -n "$JOB_ID" && test "$JOB_ID" != null
          echo "JOB_ID=$JOB_ID"

          for i in $(seq 1 120); do
            STATUS="$(curl -sS --fail-with-body "$BASE/api/debug/materialization-lab-fresh?action=status&id=$JOB_ID")"
            STATE="$(jq -r '.status' <<<"$STATUS")"
            if [[ "$STATE" == 'completed' ]]; then
              break
            fi
            if [[ "$STATE" == 'failed' ]]; then
              echo "$STATUS" | jq .
              exit 1
            fi
            if [[ "$i" == 120 ]]; then
              echo "fresh lab timed out: $STATUS" >&2
              exit 1
            fi
            sleep 5
          done

          echo 'FRESH_RESULT_BEGIN'
          jq '{id,status,build_commit,situation_mode,historical_texture,post_count,body_count,failures,usage,error,articles:[.articles[]|{id,board_id,author,subject,body}]}' <<<"$STATUS"
          echo 'FRESH_RESULT_END'
          test "$(jq -r '.body_count // 0' <<<"$STATUS")" -gt 0
