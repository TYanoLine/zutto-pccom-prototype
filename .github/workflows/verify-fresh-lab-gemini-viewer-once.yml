name: verify-fresh-lab-gemini-viewer-once
on:
  push:
    branches:
      - ops/verify-fresh-lab-gemini-viewer-20260912
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run fresh title-first Lab and verify body model
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://zutto-pccom-prototype.onrender.com'
          EXPECT='be364b08e70afa85824ac1497766e6a0deef5cf7'

          START="$(curl -sS --fail-with-body -X POST "$BASE/api/debug/materialization-lab-fresh?action=start&situation_mode=title-first&historical_texture=model-memory&board_count=4&shell_limit=4")"
          JOB_ID="$(jq -r '.id' <<<"$START")"
          test -n "$JOB_ID" && test "$JOB_ID" != null
          echo "JOB_ID=$JOB_ID"

          for i in $(seq 1 180); do
            STATUS="$(curl -sS --fail-with-body "$BASE/api/debug/materialization-lab-fresh?action=status&id=$JOB_ID")"
            STATE="$(jq -r '.status' <<<"$STATUS")"
            if [[ "$STATE" == 'completed' ]]; then break; fi
            if [[ "$STATE" == 'failed' ]]; then echo "$STATUS" | jq .; exit 1; fi
            if [[ "$i" == 180 ]]; then echo "$STATUS" | jq .; exit 1; fi
            sleep 5
          done

          echo 'RESULT_BEGIN'
          echo "$STATUS" | jq '{id,status,build_commit,situation_mode,historical_texture,board_count,shell_limit,post_count,body_count,failures,usage,body_models:([.articles[].body_model]|unique),subjects:[.articles[]|{board_id,id,author,subject,body_model}]}'
          echo 'RESULT_END'
          test "$(jq -r '.build_commit' <<<"$STATUS")" = "$EXPECT"
          test "$(jq -r '.body_count // 0' <<<"$STATUS")" -gt 0
          test "$(jq '[.articles[] | select(.body != "") | select(.body_model != "gemini-3.8-flash")] | length' <<<"$STATUS")" -eq 0
          test "$(jq '[.articles[] | select(.body != "") | select(.body_model == "gemini-3.8-flash")] | length' <<<"$STATUS")" -gt 0
          echo "VIEWER=https://zutto-pccom-prototype-liart.vercel.app/poc/materialization-lab-viewer?job=$JOB_ID"
