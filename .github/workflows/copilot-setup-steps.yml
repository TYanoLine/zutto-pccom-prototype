name: "Copilot Setup Steps"

# Prepares the environment used by the GitHub Copilot cloud agent so it can run
# the same checks as CI (go test, npm test) before its network firewall starts.
# The job must be named `copilot-setup-steps`. It only runs on its own when this
# file changes, so it does not add load to normal pull requests.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Download Go modules
        working-directory: apps/server
        run: go mod download

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
