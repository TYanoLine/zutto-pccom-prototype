name: compact-materialization-lab-viewer-diff
on:
  push:
    branches:
      - feature/materialization-lab-readonly-viewer-20260908
    paths:
      - .github/scripts/compact_lab_viewer_diff.py
      - .github/workflows/compact-materialization-lab-viewer-diff.yml
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/materialization-lab-readonly-viewer-20260908
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Restore noisy files and reapply minimal edits
        run: |
          git checkout origin/main -- apps/server/cmd/server/main.go apps/server/cmd/server/materialization_lab.go
          python3 .github/scripts/compact_lab_viewer_diff.py
      - name: Test server
        run: cd apps/server && go test ./...
      - name: Commit compact diff and remove helpers
        run: |
          rm .github/scripts/compact_lab_viewer_diff.py .github/workflows/compact-materialization-lab-viewer-diff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep Lab viewer server diff focused'
          git push origin HEAD:feature/materialization-lab-readonly-viewer-20260908
