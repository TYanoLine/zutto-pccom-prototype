name: Research Bickle corpus run

on:
  push:
    branches:
      - research-subject-corpus-bickle-run

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install charset-normalizer
      - name: Acquire Bickle Net source subset
        shell: bash
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          mod = runpy.run_path('scripts/research/archive_pccom_sources.py')
          items = [x for x in mod['SOURCES'] if x[1] == 'Bickle Net']
          root = Path(os.environ['RUNNER_TEMP']) / 'zutto-bickle-research'
          root.mkdir(parents=True, exist_ok=True)
          robots = {}
          records = []
          for i, item in enumerate(items, 1):
              print(f'[{i}/{len(items)}] {item[0]}', flush=True)
              records.append(mod['fetch'](item, root, robots, 2.0))
          mod['write_outputs'](root, records)
          print(json.dumps({r['source_id']: r['status'] for r in records}, ensure_ascii=False, indent=2))
          PY
      - name: Pack Bickle research archive
        run: cd "$RUNNER_TEMP" && zip -qr zutto-bickle-research.zip zutto-bickle-research
      - name: Upload private Bickle research artifact
        uses: actions/upload-artifact@v4
        with:
          name: zutto-bickle-research
          path: ${{ runner.temp }}/zutto-bickle-research.zip
          retention-days: 1
          if-no-files-found: error
