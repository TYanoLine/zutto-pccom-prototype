name: apply-interactive-reasoning-profile-once

on:
  push:
    branches:
      - perf/interactive-title-reasoning-profile
    paths:
      - .github/workflows/apply-interactive-reasoning-profile-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/interactive-title-reasoning-profile
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: python3 scripts/apply_interactive_reasoning_profile.py
      - name: Format
        run: |
          cd apps/server
          gofmt -w \
            internal/llm/openai_structured_timeline.go \
            internal/llm/bbs_title_candidates.go \
            internal/llm/bbs_title_era.go \
            internal/llm/bbs_title_interactive_profile_test.go \
            internal/worldrepo/materialization_title_first.go \
            internal/worldrepo/materialization_interactive_title_profile.go
      - name: Test
        run: |
          cd apps/server
          go test ./...
      - name: Commit applied patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server/internal/llm apps/server/internal/worldrepo
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Pin fast reasoning profile for interactive title planning'
            git push
          fi
