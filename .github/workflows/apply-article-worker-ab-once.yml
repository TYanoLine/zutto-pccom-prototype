name: apply-article-worker-ab-once

on:
  push:
    branches:
      - feat/article-worker-ab
    paths:
      - .github/workflows/apply-article-worker-ab-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/article-worker-ab
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Apply patch
        run: |
          # Apply from clean main-derived branch, then patch regression fixtures.
          python3 scripts/apply_article_worker_ab.py
          python3 scripts/fix_article_worker_ab_tests.py
      - name: Format
        run: |
          cd apps/server
          gofmt -w internal/config/config.go internal/llm internal/worldrepo cmd/server
      - name: Test
        run: |
          cd apps/server
          go test ./...
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/server .env.example docs/MATERIALIZATION_LAB.md
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Add Gemini article worker A/B comparison'
            git push
          fi
