name: verify-expanded-interactive-bbs-once

on:
  push:
    branches:
      - ops/verify-expanded-interactive-bbs-20260911
    paths:
      - .github/workflows/verify-expanded-interactive-bbs-once.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/verify-expanded-interactive-bbs-20260911
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Generate and inspect six live board indexes
        run: |
          cd apps/server
          ZUTTO_LIVE_SMOKE=1 go test ./internal/ws -run TestLiveExpandedInteractiveBBSSample -v -count=1 -timeout=13m
