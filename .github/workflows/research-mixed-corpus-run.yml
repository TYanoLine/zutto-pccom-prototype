name: Research remaining text sources run

on:
  push:
    branches:
      - research-subject-corpus-mixed-run

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install charset-normalizer
      - name: Acquire remaining text-capable source subset
        shell: bash
        run: |
          python - <<'PY'
          import json, os, runpy
          from pathlib import Path
          mod = runpy.run_path('scripts/research/archive_pccom_sources.py')
          wanted = {
            'Midnight Driving','Minkymoon Network','Yokohama Totsuka BBS',
            'Hanzou BBS','T.C.M.network','Tokyo BBS','PC-VAN Keiei SIG',
            'PC-VAN Rumic World SIG','NIFTY-Serve FTRAIN'
          }
          items = [x for x in mod['SOURCES'] if x[1] in wanted]
          root = Path(os.environ['RUNNER_TEMP']) / 'zutto-remaining-research'
          root.mkdir(parents=True, exist_ok=True)
          robots = {}
          records = []
          for i, item in enumerate(items, 1):
              print(f'[{i}/{len(items)}] {item[0]}', flush=True)
              records.append(mod['fetch'](item, root, robots, 2.0))
          mod['write_outputs'](root, records)
          print(json.dumps({r['source_id']: r['status'] for r in records}, ensure_ascii=False, indent=2))
          PY
      - name: Pack remaining research archive
        run: cd "$RUNNER_TEMP" && zip -qr zutto-remaining-research.zip zutto-remaining-research
      - name: Upload private remaining research artifact
        uses: actions/upload-artifact@v4
        with:
          name: zutto-remaining-research
          path: ${{ runner.temp }}/zutto-remaining-research.zip
          retention-days: 1
          if-no-files-found: error
