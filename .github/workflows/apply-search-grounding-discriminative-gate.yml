name: Apply discriminative historical grounding gate
on:
  push:
    branches: [fix/search-grounding-discriminative-gate-20260908]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-grounding-discriminative-gate-20260908
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Patch and test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('apps/server/internal/worldrepo/materialization_search_grounding.go')
          s=p.read_text()
          old='候補が複数あり一意に選べないこと自体は問題ありません。十分な根拠がない場合は『具体化不要』と明記してください。重要:'
          new='候補が複数あり一意に選べないこと自体は問題ありません。ただし、単に「1996年に存在し、この出来事にも当てはめられる」というだけの任意の具体例は候補にしないでください。このSituationのobject・occurrence・actor_observationに、他の一般的な同時代候補よりその実在物を強く指す識別的な手掛かりがある場合だけ候補を返してください。互いに無関係な多数の製品・作品へ同程度に当てはまる出来事（例: ただ遊んだ、音量を変えた、何度か再挑戦した、早めに切り上げた）なら、固有名詞を付ける根拠にはならないので『具体化不要』としてください。目安として、候補固有または狭いクラスに結びつく独立した意味上の手掛かりが2つ以上あるかを確認してください。十分な根拠がない場合は『具体化不要』と明記してください。重要:'
          if old not in s:
              raise SystemExit('grounding search contract target not found')
          p.write_text(s.replace(old,new,1))

          p=Path('apps/server/internal/llm/openai_world_situation_proposer.go')
          s=p.read_text()
          old='Use at most one searched real referent only when the supplied evidence genuinely fits that exact generic object; naming that object is preferred over repeating the generic label. The searched evidence verifies historical availability, while this world-Situation pass decides the modest actor involvement. Do not turn alternative candidates into multiple events. If no candidate cleanly fits, keep the original generic object.'
          new='Use at most one searched real referent only when the ORIGINAL SITUATION contains discriminating semantic clues that make that referent materially better identified than ordinary contemporary alternatives. Historical availability or mere plausibility is not enough. Do NOT choose one name from a menu of unrelated candidates just to make prose concrete. If two or more unrelated candidates fit the original event about equally well, keep the original generic object. Likewise, if the evidence presents a named thing only as one possible example of a broad activity, keep it generic. Naming is allowed only when the original object/activity plus occurrence/observation narrow the identity or a historically meaningful small class; otherwise omission is the correct result. The searched evidence verifies historical availability, while this world-Situation pass decides the modest actor involvement. Do not turn alternative candidates into multiple events. If no candidate is discriminatively supported, keep the original generic object.'
          if old not in s:
              raise SystemExit('grounding retry policy target not found')
          p.write_text(s.replace(old,new,1))

          t=Path('apps/server/internal/worldrepo/materialization_search_grounding_test.go')
          ts=t.read_text()
          ts += '''\n\nfunc TestDevelopmentSearchGroundingEvidenceRequestRejectsArbitraryPeriodExamples(t *testing.T) {\n\tdate := time.Date(1996, 8, 15, 12, 0, 0, 0, time.FixedZone("JST", 9*3600))\n\troot := developmentWindowShell{eventID: "music", board: world.Board{ID: "5", Name: "音楽"}, shell: developmentTimelineShell{createdAt: date, anchorKey: "music"}}\n\tproposal := developmentSituationProposal{objectClass: "曲を聴く音量", occurrence: "同じ曲を少し小さい音量で聴いた", actorObservation: "細かい音が聞きやすいと感じた", noveltyKey: "volume"}\n\treq := developmentSearchGroundingEvidenceRequest(root, proposal)\n\tfor _, want := range []string{"任意の具体例", "識別的な手掛かり", "2つ以上", "具体化不要"} {\n\t\tif !strings.Contains(req.Need, want) {\n\t\t\tt.Fatalf("grounding Need missing discriminative rule %q: %s", want, req.Need)\n\t\t}\n\t}\n}\n'''
          t.write_text(ts)
          PY
          gofmt -w apps/server/internal/worldrepo/materialization_search_grounding.go apps/server/internal/worldrepo/materialization_search_grounding_test.go apps/server/internal/llm/openai_world_situation_proposer.go
          cd apps/server && go test ./...
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-search-grounding-discriminative-gate.yml
          git add -A
          git commit -m 'Require discriminative evidence before naming historical referents'
          git push origin HEAD:fix/search-grounding-discriminative-gate-20260908
