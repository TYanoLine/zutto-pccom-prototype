name: Run observe-only Materialization Lab once

on:
  push:
    branches:
      - ops/run-observe-only-lab-20260912

jobs:
  run-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run three surface-subject Luna fresh title-first Labs
        shell: bash
        run: |
          set -euo pipefail
          base='https://zutto-pccom-prototype.onrender.com/api/debug/materialization-lab-fresh'
          for round in 1 2 3; do
            echo "=== surface round ${round} ==="
            start="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "${base}?action=start&situation_mode=title-first&historical_texture=model-memory&era_gate=observe-only&board_count=6&shell_limit=10")"
            printf '%s\n' "$start" | tee "lab-start-${round}.json"
            id="$(printf '%s' "$start" | jq -r '.id')"
            test -n "$id"
            test "$id" != null

            final=''
            for attempt in $(seq 1 180); do
              final="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}?action=status&id=${id}")"
              state="$(printf '%s' "$final" | jq -r '.status')"
              echo "round=$round attempt=$attempt status=$state"
              if [ "$state" = completed ] || [ "$state" = failed ]; then
                break
              fi
              sleep 10
            done
            printf '%s\n' "$final" | tee "lab-final-${round}.json"
            test "$(printf '%s' "$final" | jq -r '.status')" = completed
            test "$(printf '%s' "$final" | jq -r '.era_gate')" = observe-only
          done

      - name: Upload Lab results
        uses: actions/upload-artifact@v4
        with:
          name: surface-subject-luna-large-sample
          path: lab-final-*.json
