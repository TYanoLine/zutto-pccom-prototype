name: Run observe-only Materialization Lab once

on:
  push:
    branches:
      - ops/run-observe-only-lab-20260912

jobs:
  run-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start X68k-shaped Luna fresh title-first Lab
        shell: bash
        run: |
          set -euo pipefail
          base='https://zutto-pccom-prototype.onrender.com/api/debug/materialization-lab-fresh'
          start="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 -X POST "${base}?action=start&situation_mode=title-first&historical_texture=model-memory&era_gate=observe-only&board_count=4&shell_limit=10")"
          printf '%s\n' "$start" | tee /tmp/lab-start.json
          id="$(printf '%s' "$start" | jq -r '.id')"
          test -n "$id"
          test "$id" != null
          echo "LAB_JOB_ID=$id" >> "$GITHUB_ENV"

      - name: Wait for Lab completion
        shell: bash
        run: |
          set -euo pipefail
          base='https://zutto-pccom-prototype.onrender.com/api/debug/materialization-lab-fresh'
          final=''
          for attempt in $(seq 1 120); do
            final="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "${base}?action=status&id=${LAB_JOB_ID}")"
            state="$(printf '%s' "$final" | jq -r '.status')"
            echo "attempt=$attempt status=$state"
            if [ "$state" = completed ] || [ "$state" = failed ]; then
              break
            fi
            sleep 10
          done
          printf '%s\n' "$final" | tee lab-final.json
          test "$(printf '%s' "$final" | jq -r '.status')" = completed
          test "$(printf '%s' "$final" | jq -r '.era_gate')" = observe-only

      - name: Upload Lab result
        uses: actions/upload-artifact@v4
        with:
          name: x68k-shaped-luna-lab-result
          path: lab-final.json
