name: update-title-first-docs-once

on:
  push:
    branches:
      - docs/title-first-grounded-pool

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Update title-first documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/title-first-grounded-pool
      - name: Update title-first docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/MATERIALIZATION_LAB.md')
          s = p.read_text()
          old = '''- 最初の生成には「<世界日付>のパソコン通信botを再現します。以下条件の掲示板における記事タイトル候補を20個作ってください。掲示板名『<板名>』具体的な固有名詞を含めても良いです。」のみを使用する。人物・投稿理由・件名の文体指示を混ぜない。1995年固定ではなく実際の世界日付を使う。
- 独立rootの投稿枠がある板ごとに20候補。後段でモデルが、既存の人物・日時・発言目的に合う割り当てを提案し、世界側がID・重複・必須項目等を検査して採用する。投稿枠自体の人物や日時は変えない。未採用rootとそれに依存する返信は作らず、件数を埋めない。
'''
          new = '''- 件名生成の基礎プロンプトは「<世界日付>のパソコン通信botを再現します。以下条件の掲示板における記事タイトル候補を20個作ってください。掲示板名『<板名>』具体的な固有名詞を含めても良いです。」を維持する。1995年固定ではなく実際の世界日付を使う。
- title-firstでは、人物割当前にworld層が各独立rootの `developmentSparseSituation`（kind / summary / facts）をcanonical micro-situationとして確定する。これは記事の人物とは独立した「使ってよい世界事実」で、タイトル候補から新しい出来事を発生させるための材料ではない。
- 独立rootの投稿枠がある板ごとに20候補。候補生成には人物名・PersonaFacts・所有物・過去を渡さず、canonical micro-situationだけを渡す。各situationについて最低2件の対応候補を混ぜ、残りは板全体から従来どおり自由生成する。自由候補では具体的な固有名詞も許す。
- situation対応候補は、入力にない購入・所有・訪問・故障・クリア・地域イベント等を追加せず、入力にない作品・製品・場所を本人が実際に使った事実として結び付けない。英語のsituation分類や説明の直訳ではなく、当時の日本語BBSで自然な短い件名にする。
- 後段でモデルが、canonical micro-situation・既存の人物・日時・発言目的に合う割り当てを提案し、世界側がID・重複・必須項目・Fact Gate等を検査して採用する。投稿枠自体の人物や日時、canonical situationは変えない。未採用rootとそれに依存する返信は作らず、件数を埋めない。
'''
          if old not in s:
              raise SystemExit('target paragraph not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/update-title-first-docs-once.yml
          git config user.name 'TYanoLine'
          git config user.email '106317971+TYanoLine@users.noreply.github.com'
          git add docs/MATERIALIZATION_LAB.md
          git commit -m 'Document canonical situation title pools'
          git push origin HEAD:docs/title-first-grounded-pool
