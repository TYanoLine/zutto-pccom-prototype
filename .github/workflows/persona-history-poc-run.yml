name: persona-history-poc-run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/persona-history-poc-run.yml
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start persona history experiment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://zutto-pccom-prototype.onrender.com/api/debug/persona-history?action=start'
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o start.json -w '%{http_code}' -X POST "$URL")
            echo "start attempt=$attempt http=$code"
            cat start.json
            echo
            if [ "$code" = "200" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              exit 1
            fi
            sleep 10
          done
          id=$(jq -r '.id // empty' start.json)
          test -n "$id"
          echo "JOB_ID=$id" >> "$GITHUB_ENV"

      - name: Poll until complete
        shell: bash
        run: |
          set -euo pipefail
          URL="https://zutto-pccom-prototype.onrender.com/api/debug/persona-history?action=status&id=$JOB_ID"
          for attempt in $(seq 1 120); do
            curl -fsS "$URL" -o status.json
            state=$(jq -r '.status' status.json)
            completed=$(jq -r '.progress.completed_steps // 0' status.json)
            total=$(jq -r '.progress.total_steps // 0' status.json)
            echo "poll=$attempt status=$state progress=$completed/$total"
            if [ "$state" = "completed" ]; then
              break
            fi
            if [ "$state" = "failed" ]; then
              cat status.json
              exit 1
            fi
            if [ "$attempt" = "120" ]; then
              cat status.json
              exit 1
            fi
            sleep 5
          done

      - name: Print measured result
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            id,status,world_date,summary,
            profiles,
            rounds:[.rounds[] | {
              round,
              situations,
              posts,
              decisions,
              history_after
            }],
            history
          }' status.json

      - name: Upload full result
        uses: actions/upload-artifact@v4
        with:
          name: persona-history-poc-result
          path: status.json
          retention-days: 7
