name: deploy-self-hosted

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-self-hosted.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Deploy to serving directory
        shell: powershell
        run: |
          $deployDir = "C:\zutto-web"
          if (!(Test-Path $deployDir)) {
            New-Item -ItemType Directory -Force -Path $deployDir
          }
          Copy-Item -Recurse -Force dist "$deployDir\"
          Copy-Item -Recurse -Force api "$deployDir\"
          Copy-Item -Force server.mjs "$deployDir\"
          Write-Host "Deployment to $deployDir completed successfully."
