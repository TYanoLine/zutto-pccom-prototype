name: deploy-self-hosted

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Deploy to serving directory
        run: |
          if not exist "C:\zutto-web" mkdir "C:\zutto-web"
          xcopy /E /I /Y dist "C:\zutto-web\dist"
          xcopy /E /I /Y api "C:\zutto-web\api"
          copy /Y server.mjs "C:\zutto-web\"
          echo Deployment to C:\zutto-web completed successfully.

      - name: Restart Web Server
        run: |
          schtasks /end /tn "ZuttoWebServer" >nul 2>&1 || exit /b 0
          timeout /t 1 /nobreak >nul
          schtasks /run /tn "ZuttoWebServer"
          echo Web server restarted via Scheduled Task (ZuttoWebServer).
