name: Apply Historical References Toggle

on:
  push:
    branches:
      - fix/historical-references-toggle-20260907
    paths:
      - scripts/apply_historical_references_toggle.py
      - .github/workflows/historical-references-toggle-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historical-references-toggle-20260907
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Apply patch
        run: python3 scripts/apply_historical_references_toggle.py
      - name: Format
        run: gofmt -w apps/server/internal/config/config.go apps/server/internal/config/config_test.go apps/server/internal/worldrepo/llm_materializer.go apps/server/internal/worldrepo/llm_materializer_test.go apps/server/internal/worldrepo/materialization_world_window_producer.go apps/server/internal/worldrepo/materialization_intent_planner.go apps/server/internal/worldrepo/materialization_discourse_mode_test.go apps/server/cmd/server/main.go
      - name: Test server
        working-directory: apps/server
        run: go test ./...
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/historical-references-toggle-patch.yml scripts/apply_historical_references_toggle.py
          git add .env.example apps/server docs/WORLD_WINDOW_PRODUCER.md
          git commit -m "Add historical reference generation toggle"
          git push origin HEAD:fix/historical-references-toggle-20260907
