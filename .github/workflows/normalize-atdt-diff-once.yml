name: normalize-atdt-diff-once
on:
  push:
    branches: [feat/main-lab-link-and-atdt-title-first]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.head_commit.message == 'Run ATDT diff normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/main-lab-link-and-atdt-title-first
          fetch-depth: 0
      - name: Restore main.go formatting and update docs
        run: |
          git show origin/main:apps/server/cmd/server/main.go > apps/server/cmd/server/main.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/server/cmd/server/main.go')
          s = p.read_text()
          old = '\truntimeStore := worldrepo.New(store, worldEngine, postMaterializer, cfg.WorldDate)\n'
          new = old + '\truntimeStore.EnableDevelopmentInteractiveTitleFirstPoC()\n'
          if old not in s:
              raise SystemExit('runtimeStore line not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/MATERIALIZATION_LAB.md')
          s = p.read_text()
          old = '通常runtimeのmaterializationはこのPoCを自動では有効化せず、既存Producer経路を維持する。'
          new = '通常runtimeでも開発ホスト `0450000196` は Conversation View + title-first を有効化する。Web端末から `ATDT0450000196` で接続し、`B` で未生成Envelopeを計画、記事番号を開いてArticle Detail込み本文を遅延生成できる。`ALLBODY` では全本文を一括生成でき、`RESET` 後はtitle-first候補・割当も新しいplanning passへ再初期化する。ほかのホストプログラムにはこの開発専用経路を適用しない。'
          if old not in s:
              raise SystemExit('runtime documentation sentence not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Test server
        working-directory: apps/server
        run: go test ./...
      - name: Commit normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/cmd/server/main.go docs/MATERIALIZATION_LAB.md
          git commit -m 'Document interactive title-first development access'
          git push origin HEAD:feat/main-lab-link-and-atdt-title-first
