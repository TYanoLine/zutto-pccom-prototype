name: verify-reply-repair-after-102

on:
  push:
    branches:
      - ops/verify-reply-repair-after-102-20260911
    paths:
      - .github/workflows/verify-reply-repair-after-102.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/verify-reply-repair-after-102-20260911
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Verify live stored reply subjects
        run: |
          cd apps/server
          ZUTTO_LIVE_SMOKE=1 go test ./internal/ws -run TestLiveReplyRepairAfter102 -v -count=1
