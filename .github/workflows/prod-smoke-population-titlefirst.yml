name: prod-smoke-population-titlefirst

on:
  push:
    branches:
      - debug/prod-smoke-population-titlefirst-20260922

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check websockets
      - run: python .github/scripts/hakata_population_titlefirst_smoke.py
