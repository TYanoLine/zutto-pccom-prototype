name: Research PC-VAN Rumic preserved logs

on:
  push:
    branches:
      - research-pcvan-rumic-run

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install charset-normalizer
      - name: Acquire explicitly enumerated past-log index pages
        shell: bash
        run: |
          python - <<'PY'
          import os,runpy,json
          from pathlib import Path
          mod=runpy.run_path('scripts/research/archive_pccom_sources.py')
          # The preserved index itself reports the complete pagination counts:
          # Rumic World board = 46 pages / 2296 posts; Communication board = 66 pages / 3261 posts.
          # Page 3 also exposes the page-N naming convention via its previous/next hrefs.
          # This remains a bounded, single-connection static acquisition; no recursive crawling.
          items=[]
          for stem,last_page in (('rumicworld',46),('communicate',66)):
            for page in range(1,last_page+1):
              items.append((f'pcvan-rumic-{stem}{page}p','PC-VAN Rumic World SIG',f'commercial-reference/pc-van/rumic/raw/{stem}{page}p.shtml',f'https://www.rumic.org/forum/{stem}{page}p.shtml','later-preservation','html',False))
          root=Path(os.environ['RUNNER_TEMP'])/'zutto-pcvan-rumic'
          root.mkdir(parents=True,exist_ok=True); robots={}; records=[]
          for i,item in enumerate(items,1):
            print(f'[{i}/{len(items)}] {item[0]}',flush=True); records.append(mod['fetch'](item,root,robots,2.0))
          mod['write_outputs'](root,records); print(json.dumps({r['source_id']:r['status'] for r in records},ensure_ascii=False,indent=2))
          PY
      - name: Pack archive
        run: cd "$RUNNER_TEMP" && zip -qr zutto-pcvan-rumic.zip zutto-pcvan-rumic
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zutto-pcvan-rumic
          path: ${{ runner.temp }}/zutto-pcvan-rumic.zip
          retention-days: 1
