# Curated historical naming exemplars for style grounding.
# These are REAL historical names. Do not emit them verbatim for fictional hosts.
# The tags describe naming form, not a complete historical profile of each station.
version: 1
usage: style_reference_only
do_not_generate_verbatim: true

sources:
  big_1995:
    label: INTERNET magazine 1995-10, B.I.G. project participant list
    url: https://iwparchives.jp/wp-content/themes/twentytwelve/bn/pdf/im199510-168-bbsbig.pdf
  paradise_grassroots:
    label: participant-oriented retrospective on Japanese grass-roots BBS culture
    url: https://www.paradisearmy.com/doujin/pasok3m.htm
  kinet_history:
    label: KINET / Midnight Driving operator history
    url: https://www.kinet.ne.jp/activity/
  minkymoon:
    label: Minky Moon Network operator archive
    url: https://minkymoon.jp/senden-cg/
  wdic:
    label: 通信用語の基礎知識 history
    url: https://www.wdic.org/w/WDIC/%E9%80%9A%E4%BF%A1%E7%94%A8%E8%AA%9E%E3%81%AE%E5%9F%BA%E7%A4%8E%E7%9F%A5%E8%AD%98
  astroid:
    label: recollection of 1996 techno BBS use
    url: https://note.com/astroid/n/n53a0ef12e939
  sharpnel_interview:
    label: interview mentioning mid-1990s techno/music BBS culture
    url: https://akaobi.wordpress.com/2015/03/11/interview-with-jea-sharpnelsound/
  silphium:
    label: user recollection of early-1990s BBS use
    url: https://aki.nekoruri.jp/profile
  japan_bbs_1998:
    label: 1998 japan.bbs Usenet discussion
    url: https://groups.google.com/g/japan.bbs/c/O1VECiNNHyI
  welfare_bbs:
    label: 1990s welfare/volunteer BBS network history
    url: https://www.nginet.or.jp/kinbe/work/sonobepsv1997.html
  hanzou:
    label: preserved KTBBS station
    url: https://www.hanzou.jp/hanzoubbs/index.php
  tcm:
    label: preserved NET-COCK station
    url: https://tcm.jp/

